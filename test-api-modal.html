<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试 API 密钥模态框</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .modal {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal.hidden {
      display: none;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .error-message {
      color: red;
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>测试 API 密钥模态框</h1>
  <button id="show-modal-btn">显示模态框</button>
  <div id="debug-output"></div>

  <div id="api-key-modal" class="modal">
    <div class="modal-content">
      <h2>配置Windy API密钥</h2>
      <p>请输入您的Windy API密钥</p>
      <input type="text" id="api-key-input" placeholder="输入API密钥">
      <div>
        <button id="save-api-key">保存</button>
      </div>
      <div id="api-key-error" class="error-message hidden"></div>
    </div>
  </div>

  <script type="module">
    const debugOutput = document.getElementById('debug-output');
    
    function log(message) {
      console.log(message);
      const p = document.createElement('p');
      p.textContent = message;
      debugOutput.appendChild(p);
    }

    log('页面加载完成');

    // 显示模态框按钮
    const showModalBtn = document.getElementById('show-modal-btn');
    showModalBtn.addEventListener('click', () => {
      log('显示模态框按钮被点击');
      const modal = document.getElementById('api-key-modal');
      modal.classList.remove('hidden');
    });

    // 保存按钮
    const saveBtn = document.getElementById('save-api-key');
    log('保存按钮元素: ' + (saveBtn ? '找到' : '未找到'));
    
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        log('保存按钮被点击！');
        const input = document.getElementById('api-key-input');
        const value = input.value.trim();
        log('输入值: ' + value);
        
        if (!value) {
          log('输入为空');
          const errorEl = document.getElementById('api-key-error');
          errorEl.textContent = '请输入API密钥';
          errorEl.classList.remove('hidden');
          return;
        }
        
        if (value.length < 10) {
          log('输入长度不足');
          const errorEl = document.getElementById('api-key-error');
          errorEl.textContent = 'API密钥格式不正确，长度过短';
          errorEl.classList.remove('hidden');
          return;
        }
        
        log('验证通过，保存API密钥: ' + value);
        localStorage.setItem('windy_api_key', value);
        
        const modal = document.getElementById('api-key-modal');
        modal.classList.add('hidden');
        
        alert('API密钥保存成功: ' + value);
      });
      
      log('保存按钮事件监听器已绑定');
    }

    // 测试点击事件
    saveBtn.onclick = function() {
      log('onclick 被触发');
    };
  </script>
</body>
</html>
