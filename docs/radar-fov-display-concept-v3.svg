<svg width="1280" height="820" viewBox="0 0 1280 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e9"/>
      <stop offset="1" stop-color="#f3eadf"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.50" stop-color="#f4e7d4"/>
      <stop offset="0.78" stop-color="#efd7b6"/>
      <stop offset="1" stop-color="#dec9ac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#8b5c2b" flood-opacity="0.13"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #302720; }
      .muted { fill: rgba(48,39,32,0.62); font-size: 13px; }
      .tiny { fill: rgba(48,39,32,0.58); font-size: 11px; }
      .title { font-size: 27px; font-weight: 900; }
      .section { font-size: 17px; font-weight: 900; }
      .axis { font-size: 12px; font-weight: 800; fill: rgba(48,39,32,0.72); }
      .grid { stroke: rgba(105,82,58,0.17); stroke-dasharray: 5 7; }
      .sun { stroke: #f97316; stroke-width: 3; }
      .sampleCell { fill: rgba(255,247,237,0.62); stroke: rgba(170,111,45,0.16); }
      .sampleCellActive { fill: rgba(249,115,22,0.13); stroke: rgba(249,115,22,0.58); stroke-width: 1.4; }
      .hDot { fill: #d6c4a9; stroke: #a98a5e; }
      .mDot { fill: #c3beb0; stroke: #8b8374; }
      .lDot { fill: #aaa59a; stroke: #69645c; }
      .cellText { font-size: 11px; font-weight: 900; text-anchor: middle; dominant-baseline: central; fill: rgba(48,39,32,0.72); }
    </style>
  </defs>

  <rect width="1280" height="820" fill="url(#page)"/>
  <rect x="36" y="30" width="1208" height="760" rx="24" fill="rgba(255,250,242,0.94)" stroke="rgba(170,111,45,0.16)" filter="url(#shadow)"/>

  <text x="66" y="76" class="title">视场云况雷达：更适合上线的显示结构</text>
  <text x="66" y="104" class="muted">主画面不直接展示全部采样点；采样只作为云层插值和解释依据。需要解释时，再用下方矩阵高亮对应采样。</text>

  <!-- Main radar -->
  <g transform="translate(66 132)">
    <rect x="0" y="0" width="780" height="480" rx="18" fill="rgba(255,255,255,0.44)" stroke="rgba(170,111,45,0.14)"/>
    <text x="24" y="34" class="section">用户看到：天空云层分布</text>
    <text x="24" y="56" class="muted">方位角 × 天空高度角；日落方向 305° 作为视觉锚点。</text>

    <g transform="translate(64 82)">
      <rect x="0" y="0" width="650" height="330" rx="8" fill="url(#sky)" stroke="rgba(105,82,58,0.18)"/>
      <g>
        <line x1="0" y1="330" x2="650" y2="330" class="grid"/>
        <line x1="0" y1="275" x2="650" y2="275" class="grid"/>
        <line x1="0" y1="220" x2="650" y2="220" class="grid"/>
        <line x1="0" y1="165" x2="650" y2="165" class="grid"/>
        <line x1="0" y1="110" x2="650" y2="110" class="grid"/>
        <line x1="0" y1="55" x2="650" y2="55" class="grid"/>
        <line x1="0" y1="0" x2="650" y2="0" class="grid"/>
        <text x="662" y="334" class="axis">0°</text>
        <text x="662" y="279" class="axis">5°</text>
        <text x="662" y="224" class="axis">10°</text>
        <text x="662" y="169" class="axis">15°</text>
        <text x="662" y="114" class="axis">20°</text>
        <text x="662" y="59" class="axis">25°</text>
        <text x="662" y="4" class="axis">30°</text>
      </g>

      <!-- cloud shapes -->
      <path d="M0 280 C50 264, 112 266, 152 283 C210 308, 278 312, 342 302 C410 291, 468 272, 526 260 C584 248, 626 254, 650 266 L650 330 L0 330 Z"
        fill="rgba(88,82,74,0.34)"/>
      <path d="M0 292 C60 276, 112 288, 168 300 C242 316, 328 314, 402 302 C500 286, 584 275, 650 288 L650 330 L0 330 Z"
        fill="rgba(88,82,74,0.24)"/>
      <path d="M12 280 C38 266, 68 264, 98 278 C128 258, 174 260, 204 282 C246 270, 302 278, 338 298 C276 313, 160 311, 80 300 C42 294, 20 289, 12 280 Z"
        fill="rgba(88,82,74,0.26)"/>
      <path d="M418 260 C448 244, 486 248, 514 266 C552 248, 600 250, 636 272 C586 278, 520 290, 456 288 C434 284, 422 274, 418 260 Z"
        fill="rgba(88,82,74,0.23)"/>

      <path d="M48 168 C92 145, 154 145, 200 170 C238 158, 285 166, 318 190 C254 200, 180 201, 106 193 C74 189, 54 181, 48 168 Z"
        fill="rgba(132,126,112,0.25)"/>
      <path d="M410 196 C452 174, 518 176, 554 202 C590 194, 622 202, 650 222 C592 232, 518 231, 454 220 C430 216, 414 207, 410 196 Z"
        fill="rgba(132,126,112,0.22)"/>
      <path d="M265 120 C294 104, 330 106, 356 124 C386 116, 430 122, 462 146 C410 158, 350 158, 300 148 C278 144, 266 134, 265 120 Z"
        fill="rgba(132,126,112,0.18)"/>

      <path d="M30 70 C82 52, 144 58, 190 82 C140 98, 74 96, 30 86 Z" fill="rgba(185,173,151,0.20)"/>
      <path d="M408 48 C472 30, 558 38, 622 70 C546 92, 462 86, 408 68 Z" fill="rgba(185,173,151,0.22)"/>
      <path d="M222 92 C250 80, 286 84, 310 100 C276 112, 244 110, 222 102 Z" fill="rgba(185,173,151,0.15)"/>

      <!-- sun line -->
      <line x1="325" y1="0" x2="325" y2="330" class="sun"/>
      <circle cx="325" cy="0" r="5" fill="#f97316"/>
      <circle cx="325" cy="330" r="5" fill="#f97316"/>
      <text x="325" y="-14" text-anchor="middle" fill="#ea580c" font-size="17" font-weight="900">305°</text>
      <text x="0" y="-14" class="axis">左侧视场 270°</text>
      <text x="650" y="-14" text-anchor="end" class="axis">右侧视场 340°</text>
      <text x="0" y="356" class="axis">天空高度</text>
    </g>
  </g>

  <!-- Explanation / mapping -->
  <g transform="translate(880 132)">
    <rect x="0" y="0" width="330" height="480" rx="18" fill="rgba(255,255,255,0.50)" stroke="rgba(170,111,45,0.14)"/>
    <text x="24" y="34" class="section">解释态：采样如何映射</text>
    <text x="24" y="62" class="muted">每个格子是一组方位角 × 距离采样。</text>
    <text x="24" y="84" class="muted">同一格子内有 H/M/L 三层云量。</text>

    <g transform="translate(24 120)">
      <text x="0" y="-18" class="axis">距离</text>
      <text x="38" y="-18" class="axis">A</text><text x="78" y="-18" class="axis">B</text><text x="118" y="-18" class="axis">C</text><text x="158" y="-18" class="axis">D</text><text x="198" y="-18" class="axis">E</text><text x="238" y="-18" class="axis">F</text><text x="278" y="-18" class="axis">G</text>
      <text x="-4" y="22" text-anchor="end" class="tiny">10km</text>
      <text x="-4" y="62" text-anchor="end" class="tiny">25km</text>
      <text x="-4" y="102" text-anchor="end" class="tiny">50km</text>
      <text x="-4" y="142" text-anchor="end" class="tiny">75km</text>
      <text x="-4" y="182" text-anchor="end" class="tiny">100km</text>
      <g>
        <rect class="sampleCell" x="20" y="0" width="34" height="30" rx="7"/><text class="cellText" x="37" y="15">A1</text>
        <rect class="sampleCell" x="60" y="0" width="34" height="30" rx="7"/><text class="cellText" x="77" y="15">B1</text>
        <rect class="sampleCell" x="100" y="0" width="34" height="30" rx="7"/><text class="cellText" x="117" y="15">C1</text>
        <rect class="sampleCellActive" x="140" y="0" width="34" height="30" rx="7"/><text class="cellText" x="157" y="15">D1</text>
        <rect class="sampleCell" x="180" y="0" width="34" height="30" rx="7"/><text class="cellText" x="197" y="15">E1</text>
        <rect class="sampleCellActive" x="220" y="0" width="34" height="30" rx="7"/><text class="cellText" x="237" y="15">F1</text>
        <rect class="sampleCell" x="260" y="0" width="34" height="30" rx="7"/><text class="cellText" x="277" y="15">G1</text>

        <rect class="sampleCell" x="20" y="40" width="34" height="30" rx="7"/><text class="cellText" x="37" y="55">A2</text>
        <rect class="sampleCell" x="60" y="40" width="34" height="30" rx="7"/><text class="cellText" x="77" y="55">B2</text>
        <rect class="sampleCell" x="100" y="40" width="34" height="30" rx="7"/><text class="cellText" x="117" y="55">C2</text>
        <rect class="sampleCell" x="140" y="40" width="34" height="30" rx="7"/><text class="cellText" x="157" y="55">D2</text>
        <rect class="sampleCell" x="180" y="40" width="34" height="30" rx="7"/><text class="cellText" x="197" y="55">E2</text>
        <rect class="sampleCell" x="220" y="40" width="34" height="30" rx="7"/><text class="cellText" x="237" y="55">F2</text>
        <rect class="sampleCell" x="260" y="40" width="34" height="30" rx="7"/><text class="cellText" x="277" y="55">G2</text>

        <rect class="sampleCell" x="20" y="80" width="34" height="30" rx="7"/><text class="cellText" x="37" y="95">A3</text>
        <rect class="sampleCell" x="60" y="80" width="34" height="30" rx="7"/><text class="cellText" x="77" y="95">B3</text>
        <rect class="sampleCell" x="100" y="80" width="34" height="30" rx="7"/><text class="cellText" x="117" y="95">C3</text>
        <rect class="sampleCell" x="140" y="80" width="34" height="30" rx="7"/><text class="cellText" x="157" y="95">D3</text>
        <rect class="sampleCell" x="180" y="80" width="34" height="30" rx="7"/><text class="cellText" x="197" y="95">E3</text>
        <rect class="sampleCell" x="220" y="80" width="34" height="30" rx="7"/><text class="cellText" x="237" y="95">F3</text>
        <rect class="sampleCell" x="260" y="80" width="34" height="30" rx="7"/><text class="cellText" x="277" y="95">G3</text>

        <rect class="sampleCell" x="20" y="120" width="34" height="30" rx="7"/><text class="cellText" x="37" y="135">A4</text>
        <rect class="sampleCell" x="60" y="120" width="34" height="30" rx="7"/><text class="cellText" x="77" y="135">B4</text>
        <rect class="sampleCell" x="100" y="120" width="34" height="30" rx="7"/><text class="cellText" x="117" y="135">C4</text>
        <rect class="sampleCell" x="140" y="120" width="34" height="30" rx="7"/><text class="cellText" x="157" y="135">D4</text>
        <rect class="sampleCell" x="180" y="120" width="34" height="30" rx="7"/><text class="cellText" x="197" y="135">E4</text>
        <rect class="sampleCell" x="220" y="120" width="34" height="30" rx="7"/><text class="cellText" x="237" y="135">F4</text>
        <rect class="sampleCell" x="260" y="120" width="34" height="30" rx="7"/><text class="cellText" x="277" y="135">G4</text>

        <rect class="sampleCell" x="20" y="160" width="34" height="30" rx="7"/><text class="cellText" x="37" y="175">A5</text>
        <rect class="sampleCell" x="60" y="160" width="34" height="30" rx="7"/><text class="cellText" x="77" y="175">B5</text>
        <rect class="sampleCell" x="100" y="160" width="34" height="30" rx="7"/><text class="cellText" x="117" y="175">C5</text>
        <rect class="sampleCell" x="140" y="160" width="34" height="30" rx="7"/><text class="cellText" x="157" y="175">D5</text>
        <rect class="sampleCell" x="180" y="160" width="34" height="30" rx="7"/><text class="cellText" x="197" y="175">E5</text>
        <rect class="sampleCell" x="220" y="160" width="34" height="30" rx="7"/><text class="cellText" x="237" y="175">F5</text>
        <rect class="sampleCell" x="260" y="160" width="34" height="30" rx="7"/><text class="cellText" x="277" y="175">G5</text>
      </g>
    </g>

    <g transform="translate(24 340)">
      <text x="0" y="0" class="section">当前高亮：D1 与 F1</text>
      <text x="0" y="28" class="muted">同为 10km，所以同层 y 一样。</text>
      <circle class="hDot" cx="8" cy="58" r="6"/><text x="24" y="63" class="muted">H：高云投到 30° 附近</text>
      <circle class="mDot" cx="8" cy="86" r="6"/><text x="24" y="91" class="muted">M：中云投到 22.8°</text>
      <circle class="lDot" cx="8" cy="114" r="6"/><text x="24" y="119" class="muted">L：低云投到 6.8°</text>
    </g>
  </g>

  <!-- Bottom recommendation strip -->
  <g transform="translate(66 650)">
    <rect x="0" y="0" width="1144" height="96" rx="16" fill="rgba(255,247,237,0.72)" stroke="rgba(170,111,45,0.16)"/>
    <text x="24" y="34" class="section">建议上线形态</text>
    <text x="24" y="62" class="muted">默认：只显示左侧这种连续天空云层，不显示采样点编号。调试/解释模式：点击或悬停某个区域后，右侧矩阵高亮贡献最大的采样点。</text>
    <text x="24" y="84" class="muted">这样不会让用户看到一堆 D1/F1，也能保留“这个区域来自哪些数据”的可解释性。</text>
  </g>
</svg>
