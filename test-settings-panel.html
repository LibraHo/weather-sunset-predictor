<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置面板测试</title>
  <link rel="stylesheet" href="styles/settings-panel.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .test-section {
      margin-bottom: 30px;
    }
    .test-button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
    }
    .test-button:hover {
      background: #45a049;
    }
    .test-result {
      margin-top: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>🧪 设置面板功能测试</h1>

    <div class="test-section">
      <h2>1. 打开设置面板</h2>
      <button class="test-button" onclick="testOpenSettings()">打开设置面板</button>
      <div id="result1" class="test-result"></div>
    </div>

    <div class="test-section">
      <h2>2. 测试后端服务器连接</h2>
      <button class="test-button" onclick="testBackendConnection()">测试后端连接</button>
      <div id="result2" class="test-result"></div>
    </div>

    <div class="test-section">
      <h2>3. 测试 API 模式切换</h2>
      <button class="test-button" onclick="testApiModeSwitch()">切换 API 模式</button>
      <div id="result3" class="test-result"></div>
    </div>

    <div class="test-section">
      <h2>4. 测试主题切换</h2>
      <button class="test-button" onclick="testThemeSwitch()">切换主题</button>
      <div id="result4" class="test-result"></div>
    </div>
  </div>

  <script type="module">
    import SettingsPanel from './src/components/SettingsPanel.js';

    // 初始化设置面板
    const settingsPanel = new SettingsPanel();
    settingsPanel.init();

    // 暴露到全局作用域以便 HTML 按钮调用
    window.testOpenSettings = function() {
      const result = document.getElementById('result1');
      try {
        settingsPanel.open();
        result.textContent = '✅ 成功：设置面板已打开';
        result.style.color = 'green';
      } catch (error) {
        result.textContent = '❌ 失败：' + error.message;
        result.style.color = 'red';
      }
    };

    window.testBackendConnection = async function() {
      const result = document.getElementById('result2');
      try {
        const response = await fetch('http://localhost:3000/health');
        const data = await response.json();
        result.textContent = '✅ 成功：后端服务器连接正常\n' + JSON.stringify(data, null, 2);
        result.style.color = 'green';
      } catch (error) {
        result.textContent = '❌ 失败：无法连接到后端服务器\n' + error.message;
        result.style.color = 'red';
      }
    };

    window.testApiModeSwitch = function() {
      const result = document.getElementById('result3');
      try {
        const currentMode = localStorage.getItem('api_mode') || 'proxy';
        const newMode = currentMode === 'proxy' ? 'direct' : 'proxy';
        localStorage.setItem('api_mode', newMode);
        result.textContent = `✅ 成功：API 模式已从 ${currentMode} 切换到 ${newMode}\n当前模式：${newMode}`;
        result.style.color = 'green';
      } catch (error) {
        result.textContent = '❌ 失败：' + error.message;
        result.style.color = 'red';
      }
    };

    window.testThemeSwitch = function() {
      const result = document.getElementById('result4');
      try {
        const currentTheme = localStorage.getItem('app_theme') || 'light';
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        localStorage.setItem('app_theme', newTheme);

        // 应用主题
        document.body.className = `theme-${newTheme}`;
        result.textContent = `✅ 成功：主题已从 ${currentTheme} 切换到 ${newTheme}\n当前主题：${newTheme}`;
        result.style.color = 'green';
      } catch (error) {
        result.textContent = '❌ 失败：' + error.message;
        result.style.color = 'red';
      }
    };

    // 页面加载时显示初始状态
    console.log('✅ 设置面板测试页面已加载');
    console.log('后端服务器状态:', 'http://localhost:3000/health');
    console.log('前端服务器状态:', 'http://localhost:9002');
  </script>
</body>
</html>
