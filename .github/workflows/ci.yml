name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      # This is the required gate for merging: tests must pass.
      # Keep coverage non-blocking for now because current global thresholds
      # are intentionally higher than the current project baseline.
      - name: Run tests
        run: npm test -- --runInBand --silent

      - name: Install Chromium for real-page i18n validation
        run: npx playwright install --with-deps chromium

      - name: Run primary locale real-page layout validation
        run: npx playwright test tests/e2e/primary-locale-layout.spec.js --project=chromium

      - name: Generate coverage report (non-blocking)
        run: npm run test:coverage -- --runInBand || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: |
            coverage/lcov-report
            coverage/coverage-summary.json
          retention-days: 7
