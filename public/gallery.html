<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霞客分享地图</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles/main.css">
  <script src="/vendor/leaflet/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body.gallery-body {
      color: var(--theme-text, var(--color-text));
      background:
        radial-gradient(circle at 14% 12%, color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 72%, transparent), transparent 36%),
        radial-gradient(circle at 84% 18%, rgba(96, 165, 250, 0.16), transparent 34%),
        var(--theme-bg, var(--color-bg));
    }
    #gallery-map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: var(--map-bg, #f0f0f0);
    }
    .gallery-glass {
      position: fixed;
      z-index: 1000;
      border: 1px solid var(--theme-card-border, var(--glass-border));
      background: color-mix(in srgb, var(--theme-card-bg, var(--glass-bg-heavy)) 88%, transparent);
      box-shadow: var(--glass-shadow, var(--shadow-md));
      backdrop-filter: blur(var(--glass-blur-heavy, 24px)) saturate(1.1);
      -webkit-backdrop-filter: blur(var(--glass-blur-heavy, 24px)) saturate(1.1);
    }
    .gallery-title {
      top: 16px;
      left: 72px;
      max-width: min(360px, calc(100vw - 88px));
      padding: 14px 16px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gallery-logo-icon {
      width: 34px;
      height: 34px;
      color: var(--theme-accent-strong, var(--header-icon-color));
      flex: 0 0 auto;
    }
    .gallery-title h1 {
      margin: 0;
      color: var(--theme-text, var(--color-text));
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .gallery-title p {
      margin: 3px 0 0;
      color: var(--theme-text-muted, var(--color-text-light));
      font-size: 0.82rem;
      line-height: 1.35;
    }
    .gallery-legend {
      right: 16px;
      bottom: 16px;
      padding: 10px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--theme-text-muted, var(--color-text-light));
      font-size: 0.84rem;
      pointer-events: none;
    }
    .legend-photo-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--theme-accent-strong, #f59e0b);
      background: var(--theme-accent-soft, rgba(251,146,60,0.18));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 50%, transparent);
    }
    #loading, #empty-state {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 24px 28px;
      border-radius: 22px;
      text-align: center;
      min-width: min(320px, calc(100vw - 40px));
    }
    #empty-state { display: none; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 58%, transparent);
      border-top-color: var(--theme-accent-strong, #f59e0b);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p, #empty-state p {
      margin: 0;
      color: var(--theme-text-muted, var(--color-text-light));
      font-size: 0.92rem;
    }
    #empty-state h2 {
      margin: 0 0 8px;
      color: var(--theme-text, var(--color-text));
      font-size: 1.2rem;
    }
    .photo-marker {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--theme-accent-strong, #f59e0b);
      background: var(--theme-card-bg, #111827);
      box-shadow:
        0 0 0 4px color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 68%, transparent),
        0 10px 22px rgba(0,0,0,0.32);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .photo-marker:hover {
      transform: translateY(-2px) scale(1.06);
      box-shadow:
        0 0 0 5px color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 80%, transparent),
        0 14px 28px rgba(0,0,0,0.4);
    }
    .photo-marker img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-marker.stack-marker { overflow: visible; }
    .photo-marker.stack-marker img {
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--theme-card-bg, #111827) 82%, transparent);
      box-shadow: -6px 6px 0 color-mix(in srgb, var(--theme-card-bg, #111827) 78%, transparent), -10px 10px 0 color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 80%, transparent);
    }
    .photo-count-badge {
      position: absolute;
      right: -8px;
      top: -8px;
      min-width: 24px;
      height: 24px;
      padding: 0 6px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: var(--theme-accent-strong, #f59e0b);
      border: 2px solid var(--theme-card-bg, #111827);
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 6px 14px rgba(0,0,0,0.34);
    }
    .photo-popup .leaflet-popup-content-wrapper {
      background: color-mix(in srgb, var(--theme-card-bg, #111827) 94%, transparent);
      color: var(--theme-text, #fff);
      border: 1px solid var(--theme-card-border, var(--glass-border));
      border-radius: 16px;
      box-shadow: var(--glass-shadow, 0 16px 36px rgba(0,0,0,0.35));
      backdrop-filter: blur(var(--glass-blur, 14px));
      -webkit-backdrop-filter: blur(var(--glass-blur, 14px));
      padding: 0;
    }
    .photo-popup .leaflet-popup-tip { background: var(--theme-card-bg, #111827); }
    .photo-popup .leaflet-popup-content { margin: 0; padding: 14px; }
    .popup-photo { width: 100%; max-width: 300px; border-radius: 12px; margin-bottom: 10px; display: block; }
    .popup-desc { margin: 0 0 8px; color: var(--theme-text, #fff); font-size: 0.9rem; line-height: 1.45; }
    .popup-location { display: flex; align-items: center; gap: 6px; color: var(--theme-text-muted, #aaa); font-size: 0.78rem; margin-bottom: 8px; }
    .popup-location svg { width: 14px; height: 14px; color: var(--theme-accent-strong, #f59e0b); }
    .popup-meta-list {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 4px 10px;
      color: var(--theme-text-muted, #aaa);
      font-size: 0.76rem;
      line-height: 1.35;
    }
    .popup-meta-list dt { color: var(--theme-text-muted, #aaa); opacity: 0.78; }
    .popup-meta-list dd { margin: 0; color: var(--theme-text, #fff); min-width: 0; overflow-wrap: anywhere; }
    .cluster-popup-title { margin: 0 0 10px; color: var(--theme-text, #fff); font-size: 0.92rem; font-weight: 700; }
    .cluster-photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 8px;
      width: max-content;
      max-width: 232px;
    }
    .cluster-photo-button {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      width: 72px;
      height: 72px;
    }
    .cluster-photo-button:focus-visible { outline: 2px solid var(--theme-accent-strong, #f59e0b); outline-offset: 2px; }
    .cluster-photo-button img { width: 100%; height: 100%; max-width: none; display: block; object-fit: cover; }
    @media (max-width: 640px) {
      .gallery-title { top: 12px; left: 64px; max-width: calc(100vw - 76px); padding: 12px 14px; }
      .gallery-legend { right: 12px; bottom: 12px; }
      .photo-popup .leaflet-popup-content-wrapper { max-width: calc(100vw - 28px); }
      .photo-popup .leaflet-popup-content { max-height: min(58vh, 430px); overflow: auto; }
      .cluster-photo-grid { grid-template-columns: repeat(2, 72px); max-width: 152px; }
    }
  </style>
</head>
<body class="gallery-body">
  <div id="loading" class="gallery-glass" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p data-i18n="gallery.loading">加载照片中...</p>
  </div>

  <div class="gallery-title gallery-glass">
    <svg class="gallery-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" aria-hidden="true">
      <path d="M12 44 A26 26 0 0 1 64 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="44" x2="76" y2="44" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="55" x2="66" y2="55" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="22" y1="66" x2="54" y2="66" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div>
      <h1 data-i18n="gallery.title">晚霞照片分享</h1>
      <p data-i18n="gallery.subtitle">看看世界各地分享的晚霞照片</p>
    </div>
  </div>

  <div class="gallery-legend gallery-glass" aria-label="图例" data-i18n-aria-label="gallery.legendAria">
    <span class="legend-photo-dot" aria-hidden="true"></span>
    <span data-i18n="gallery.photoLocationLegend">照片位置</span>
  </div>

  <div id="empty-state" class="gallery-glass">
    <h2 data-i18n="gallery.emptyTitle">暂无照片</h2>
    <p data-i18n="gallery.emptyBody">上传第一张火烧云照片吧。</p>
  </div>

  <div id="gallery-map"></div>

  <script type="module">
    import ChinaMapCanvas from '/src/components/ChinaMapCanvas.js';
    import i18n from '/src/i18n.js';
    import { clusterPhotosByPixelDistance, preferredPhotoUrl } from '/src/utils/galleryPhotoClusters.js';

    let mapCanvas;
    let map;
    let markers = [];
    let photoData = [];

    function t(key, params = {}) {
      return i18n.t(key, params);
    }

    function getGalleryTheme() {
      const validThemes = new Set(['light', 'dark', 'auto']);
      let savedTheme = 'auto';
      try {
        savedTheme = localStorage.getItem('app_theme') || 'auto';
      } catch (_) {
        savedTheme = 'auto';
      }
      const theme = validThemes.has(savedTheme) ? savedTheme : 'auto';
      const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
      const actualTheme = theme === 'auto' ? (systemDark ? 'dark' : 'light') : theme;
      return { theme, actualTheme };
    }

    function applyGalleryTheme() {
      const { theme, actualTheme } = getGalleryTheme();
      const root = document.documentElement;
      const body = document.body;
      const themeClasses = ['theme-light', 'theme-dark', 'theme-auto', 'theme-actual-light', 'theme-actual-dark'];
      root.classList.remove(...themeClasses);
      body.classList.remove(...themeClasses);

      root.classList.add(`theme-${theme}`, `theme-actual-${actualTheme}`);
      body.classList.add(`theme-${theme}`, `theme-actual-${actualTheme}`);
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-actual-theme', actualTheme);
      body.setAttribute('data-theme', theme);
      body.setAttribute('data-actual-theme', actualTheme);
      root.style.colorScheme = actualTheme;
      return actualTheme;
    }

    function applyGalleryI18n() {
      document.documentElement.lang = i18n.currentLanguage || 'zh-CN';
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-aria-label]').forEach((el) => {
        el.setAttribute('aria-label', t(el.dataset.i18nAriaLabel));
      });
      document.title = t('gallery.pageTitle');
    }

    function getSavedMapTileProvider() {
      try {
        const provider = localStorage.getItem('map_tile_provider') || 'auto';
        return ['auto', 'gaode', 'osm'].includes(provider) ? provider : 'auto';
      } catch (_) {
        return 'auto';
      }
    }

    function applyGalleryMapTileProvider(provider = getSavedMapTileProvider()) {
      if (!mapCanvas || typeof mapCanvas.setTileProvider !== 'function') return;
      mapCanvas.setTileProvider(provider);
    }

    function setupMapTileProviderSync() {
      window.addEventListener('storage', (event) => {
        if (event.key === 'map_tile_provider') {
          applyGalleryMapTileProvider(event.newValue || 'auto');
        }
      });

      window.addEventListener('mapTileProviderChanged', (event) => {
        applyGalleryMapTileProvider(event.detail?.provider || getSavedMapTileProvider());
      });

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        if (event.data?.type === 'mapTileProviderChanged') {
          applyGalleryMapTileProvider(event.data.provider || getSavedMapTileProvider());
        }
      });
    }

    async function initMap() {
      const actualTheme = applyGalleryTheme();
      mapCanvas = new ChinaMapCanvas({
        style: actualTheme,
        defaultCenter: [35, 105],
        defaultZoom: 4,
        showScoreLegend: false,
        enableScoreQuery: false
      });
      await mapCanvas.init(document.getElementById('gallery-map'));
      applyGalleryMapTileProvider();
      map = mapCanvas.getMap();
    }

    function safeText(value) {
      return String(value ?? '');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = safeText(text);
      return div.innerHTML;
    }

    function formatPhotoDateTime(value) {
      if (!value) return t('gallery.notProvided');
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return t('gallery.notProvided');
      return date.toLocaleString(i18n.currentLanguage || 'zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
    }

    function photoLocationText(photo) {
      const namedLocation = safeText(photo.locationName || photo.desc).trim();
      if (namedLocation) return namedLocation;
      if (Number.isFinite(Number(photo.lat)) && Number.isFinite(Number(photo.lon))) {
        return `${Number(photo.lat).toFixed(4)}, ${Number(photo.lon).toFixed(4)}`;
      }
      return t('gallery.notProvided');
    }

    function createSinglePopup(photo) {
      const filename = escapeHtml(photo.filename || t('gallery.photoAltFallback'));
      const imageUrl = escapeHtml(preferredPhotoUrl(photo));
      const icon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="photo-marker"><img src="${imageUrl}" alt="${filename}"></div>`,
        iconSize: [48, 48],
        iconAnchor: [24, 48],
        popupAnchor: [0, -48]
      });
      const locationText = photoLocationText(photo);
      const coordinatesText = Number.isFinite(Number(photo.lat)) && Number.isFinite(Number(photo.lon))
        ? `${Number(photo.lat).toFixed(4)}, ${Number(photo.lon).toFixed(4)}`
        : t('gallery.notProvided');
      const uploaderText = safeText(photo.uploaderName).trim() || t('gallery.notProvided');
      const popupContent = `
        <img src="${imageUrl}" class="popup-photo" alt="${filename}">
        <p class="popup-desc">${escapeHtml(locationText)}</p>
        <div class="popup-location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/></svg>
          <span>${escapeHtml(coordinatesText)}</span>
        </div>
        <dl class="popup-meta-list">
          <dt>${escapeHtml(t('gallery.takenAt'))}</dt><dd>${escapeHtml(formatPhotoDateTime(photo.takenAt))}</dd>
          <dt>${escapeHtml(t('gallery.locationName'))}</dt><dd>${escapeHtml(locationText)}</dd>
          <dt>${escapeHtml(t('gallery.uploadedAt'))}</dt><dd>${escapeHtml(formatPhotoDateTime(photo.uploadedAt))}</dd>
          <dt>${escapeHtml(t('gallery.uploaderName'))}</dt><dd>${escapeHtml(uploaderText)}</dd>
        </dl>
      `;
      return { icon, popupContent };
    }

    function createSingleMarker(photo) {
      const { icon, popupContent } = createSinglePopup(photo);
      const marker = L.marker([photo.lat, photo.lon], { icon, title: safeText(photo.filename || t('gallery.photoAltFallback')) });
      marker.bindPopup(popupContent, { maxWidth: 320, closeButton: true, className: 'photo-popup' });
      return marker;
    }

    function createClusterMarker(cluster) {
      const representative = cluster.representative;
      const filename = escapeHtml(representative?.filename || t('gallery.photoAltFallback'));
      const countText = t('gallery.photoCount', { count: cluster.count });
      const icon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="photo-marker stack-marker" role="button" aria-label="${escapeHtml(countText)}"><img src="${escapeHtml(preferredPhotoUrl(representative))}" alt="${filename}"><span class="photo-count-badge" aria-hidden="true">${cluster.count}</span></div>`,
        iconSize: [54, 54],
        iconAnchor: [27, 54],
        popupAnchor: [0, -54]
      });
      const marker = L.marker([cluster.lat, cluster.lon], { icon, title: countText });
      const grid = cluster.photos.map((photo, index) => {
        const photoLabel = t('gallery.clusterPhotoLabel', {
          index: index + 1,
          location: photoLocationText(photo)
        });
        return `<button type="button" class="cluster-photo-button" aria-label="${escapeHtml(photoLabel)}" title="${escapeHtml(photoLabel)}"><img src="${escapeHtml(preferredPhotoUrl(photo))}" alt="${escapeHtml(photo.filename || photoLabel)}"></button>`;
      }).join('');
      marker.bindPopup(`
        <p class="cluster-popup-title">${escapeHtml(countText)}</p>
        <div class="cluster-photo-grid" role="list" aria-label="${escapeHtml(t('gallery.clusterListAria'))}">${grid}</div>
      `, { maxWidth: 320, closeButton: true, className: 'photo-popup' });
      return marker;
    }

    function renderPhotoMarkers() {
      markers.forEach(marker => map.removeLayer(marker));
      const clusters = clusterPhotosByPixelDistance(photoData, {
        zoom: map.getZoom(),
        project: (photo) => {
          const point = map.latLngToLayerPoint([photo.lat, photo.lon]);
          return { x: point.x, y: point.y };
        }
      });
      markers = clusters.map(cluster => cluster.isCluster ? createClusterMarker(cluster) : createSingleMarker(cluster.representative));
      markers.forEach(marker => mapCanvas.addLayer(marker));
    }

    async function loadPhotos() {
      try {
        const res = await fetch('/api/photos');
        const data = await res.json();
        const photosWithLocation = (data.photos || []).filter(p => (
          typeof p.lat === 'number' && typeof p.lon === 'number'
        ));

        document.getElementById('loading').style.display = 'none';

        if (photosWithLocation.length === 0) {
          document.getElementById('empty-state').style.display = 'block';
          return;
        }

        photoData = photosWithLocation;
        renderPhotoMarkers();

        const group = L.featureGroup(photoData.map(photo => L.marker([photo.lat, photo.lon])));
        const bounds = group.getBounds();
        if (bounds && bounds.isValid()) {
          map.fitBounds(bounds.pad(0.28), { maxZoom: 7 });
        }
      } catch (err) {
        console.error('加载照片失败:', err);
        document.getElementById('loading').innerHTML = `<p>${escapeHtml(t('gallery.loadFailed'))}</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await i18n.init();
      applyGalleryTheme();
      applyGalleryI18n();
      setupMapTileProviderSync();
      await initMap();
      map.on('zoomend moveend', renderPhotoMarkers);
      await loadPhotos();
    });
  </script>
</body>
</html>
