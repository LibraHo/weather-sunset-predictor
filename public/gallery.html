<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霞客分享地图</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles/main.css">
  <script src="/vendor/leaflet/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body.gallery-body {
      color: var(--theme-text, var(--color-text));
      background:
        radial-gradient(circle at 14% 12%, color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 72%, transparent), transparent 36%),
        radial-gradient(circle at 84% 18%, rgba(96, 165, 250, 0.16), transparent 34%),
        var(--theme-bg, var(--color-bg));
    }
    #gallery-map {
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: var(--map-bg-dark, #121a2f);
    }
    .gallery-glass {
      position: fixed;
      z-index: 1000;
      border: 1px solid var(--theme-card-border, var(--glass-border));
      background: color-mix(in srgb, var(--theme-card-bg, var(--glass-bg-heavy)) 88%, transparent);
      box-shadow: var(--glass-shadow, var(--shadow-md));
      backdrop-filter: blur(var(--glass-blur-heavy, 24px)) saturate(1.1);
      -webkit-backdrop-filter: blur(var(--glass-blur-heavy, 24px)) saturate(1.1);
    }
    .gallery-title {
      top: 16px;
      left: 72px;
      max-width: min(360px, calc(100vw - 88px));
      padding: 14px 16px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .gallery-logo-icon {
      width: 34px;
      height: 34px;
      color: var(--theme-accent-strong, var(--header-icon-color));
      flex: 0 0 auto;
    }
    .gallery-title h1 {
      margin: 0;
      color: var(--theme-text, var(--color-text));
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .gallery-title p {
      margin: 3px 0 0;
      color: var(--theme-text-muted, var(--color-text-light));
      font-size: 0.82rem;
      line-height: 1.35;
    }
    .gallery-legend {
      right: 16px;
      bottom: 16px;
      padding: 10px 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--theme-text-muted, var(--color-text-light));
      font-size: 0.84rem;
      pointer-events: none;
    }
    .legend-photo-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--theme-accent-strong, #f59e0b);
      background: var(--theme-accent-soft, rgba(251,146,60,0.18));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 50%, transparent);
    }
    #loading, #empty-state {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 24px 28px;
      border-radius: 22px;
      text-align: center;
      min-width: min(320px, calc(100vw - 40px));
    }
    #empty-state { display: none; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 58%, transparent);
      border-top-color: var(--theme-accent-strong, #f59e0b);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p, #empty-state p {
      margin: 0;
      color: var(--theme-text-muted, var(--color-text-light));
      font-size: 0.92rem;
    }
    #empty-state h2 {
      margin: 0 0 8px;
      color: var(--theme-text, var(--color-text));
      font-size: 1.2rem;
    }
    .photo-marker {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--theme-accent-strong, #f59e0b);
      background: var(--theme-card-bg, #111827);
      box-shadow:
        0 0 0 4px color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 68%, transparent),
        0 10px 22px rgba(0,0,0,0.32);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .photo-marker:hover {
      transform: translateY(-2px) scale(1.06);
      box-shadow:
        0 0 0 5px color-mix(in srgb, var(--theme-accent-soft, rgba(251,146,60,0.18)) 80%, transparent),
        0 14px 28px rgba(0,0,0,0.4);
    }
    .photo-marker img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-popup .leaflet-popup-content-wrapper {
      background: color-mix(in srgb, var(--theme-card-bg, #111827) 94%, transparent);
      color: var(--theme-text, #fff);
      border: 1px solid var(--theme-card-border, var(--glass-border));
      border-radius: 16px;
      box-shadow: var(--glass-shadow, 0 16px 36px rgba(0,0,0,0.35));
      backdrop-filter: blur(var(--glass-blur, 14px));
      -webkit-backdrop-filter: blur(var(--glass-blur, 14px));
      padding: 0;
    }
    .photo-popup .leaflet-popup-tip { background: var(--theme-card-bg, #111827); }
    .photo-popup .leaflet-popup-content { margin: 0; padding: 14px; }
    .popup-photo { width: 100%; max-width: 300px; border-radius: 12px; margin-bottom: 10px; display: block; }
    .popup-desc { margin: 0 0 8px; color: var(--theme-text, #fff); font-size: 0.9rem; line-height: 1.45; }
    .popup-location { display: flex; align-items: center; gap: 6px; color: var(--theme-text-muted, #aaa); font-size: 0.78rem; }
    .popup-location svg { width: 14px; height: 14px; color: var(--theme-accent-strong, #f59e0b); }
    @media (max-width: 640px) {
      .gallery-title { top: 12px; left: 64px; max-width: calc(100vw - 76px); padding: 12px 14px; }
      .gallery-legend { right: 12px; bottom: 12px; }
    }
  </style>
</head>
<body class="theme-dark gallery-body">
  <div id="loading" class="gallery-glass" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>加载照片中...</p>
  </div>

  <div class="gallery-title gallery-glass">
    <svg class="gallery-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 76" aria-hidden="true">
      <path d="M12 44 A26 26 0 0 1 64 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="44" x2="76" y2="44" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <line x1="10" y1="55" x2="66" y2="55" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="22" y1="66" x2="54" y2="66" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>晚霞照片分享</h1>
      <p>看看世界各地分享的晚霞照片</p>
    </div>
  </div>

  <div class="gallery-legend gallery-glass" aria-label="图例">
    <span class="legend-photo-dot" aria-hidden="true"></span>
    <span>照片位置</span>
  </div>

  <div id="empty-state" class="gallery-glass">
    <h2>暂无照片</h2>
    <p>上传第一张火烧云照片吧。</p>
  </div>

  <div id="gallery-map"></div>

  <script type="module">
    import ChinaMapCanvas from '/src/components/ChinaMapCanvas.js';

    let mapCanvas;
    let map;
    let markers = [];

    async function initMap() {
      mapCanvas = new ChinaMapCanvas({
        style: 'dark',
        defaultCenter: [35, 105],
        defaultZoom: 4,
        showScoreLegend: false,
        enableScoreQuery: false
      });
      await mapCanvas.init(document.getElementById('gallery-map'));
      map = mapCanvas.getMap();
    }

    function safeText(value) {
      return String(value ?? '');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = safeText(text);
      return div.innerHTML;
    }

    function createMarker(photo) {
      const filename = escapeHtml(photo.filename || 'firecloud photo');
      const icon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="photo-marker"><img src="${escapeHtml(photo.thumbUrl)}" alt="${filename}"></div>`,
        iconSize: [48, 48],
        iconAnchor: [24, 48],
        popupAnchor: [0, -48]
      });

      const marker = L.marker([photo.lat, photo.lon], { icon });
      const popupContent = `
        <img src="${escapeHtml(photo.thumbUrl)}" class="popup-photo" alt="${filename}">
        ${photo.desc ? `<p class="popup-desc">${escapeHtml(photo.desc)}</p>` : ''}
        <div class="popup-location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="currentColor"/></svg>
          <span>${Number(photo.lat).toFixed(4)}, ${Number(photo.lon).toFixed(4)}</span>
        </div>
      `;
      marker.bindPopup(popupContent, { maxWidth: 320, closeButton: true, className: 'photo-popup' });
      return marker;
    }

    async function loadPhotos() {
      try {
        const res = await fetch('/api/photos');
        const data = await res.json();
        const photosWithLocation = (data.photos || []).filter(p => (
          typeof p.lat === 'number' && typeof p.lon === 'number'
        ));

        document.getElementById('loading').style.display = 'none';

        if (photosWithLocation.length === 0) {
          document.getElementById('empty-state').style.display = 'block';
          return;
        }

        markers.forEach(marker => map.removeLayer(marker));
        markers = photosWithLocation.map(createMarker);
        markers.forEach(marker => mapCanvas.addLayer(marker));

        const group = L.featureGroup(markers);
        const bounds = group.getBounds();
        if (bounds && bounds.isValid()) {
          map.fitBounds(bounds.pad(0.28), { maxZoom: 7 });
        }
      } catch (err) {
        console.error('加载照片失败:', err);
        document.getElementById('loading').innerHTML = '<p>加载失败，请刷新重试</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initMap();
      await loadPhotos();
    });
  </script>
</body>
</html>
